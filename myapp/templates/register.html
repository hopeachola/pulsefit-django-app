{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFit - Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">

    <main class="log-section" style="width: 100%; max-width: 420px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <header style="text-align: center; margin-bottom: 25px;">
            <h1 style="font-size: 28px; color: #0f172a; font-weight: 800; letter-spacing: -0.5px;">Pulse<span style="color: #10b981;">Fit</span></h1>
            <p style="color: #64748b; font-size: 14.5px; margin-top: 4px;">Create your fitness profile to get started</p>
        </header>

        <form class="log-form" method="POST">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">{{ field.label }}</label>
                <!-- Render standard field with clean formatting instructions -->
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; outline: none;" required>
                {% if field.help_text %}
                <small style="color: #94a3b8; font-size: 11px; display: block; margin-top: 2px; line-height: 1.3;">{{ field.help_text }}</small>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="submit-btn" style="width: 100%; padding: 12px; font-size: 15px; cursor: pointer; margin-top: 10px;">Sign Up Account</button>
        </form>

        <footer style="text-align: center; margin-top: 20px; font-size: 13.5px; color: #64748b;">
            Already have an account? <a href="{% url 'login' %}" style="color: #10b981; font-weight: 600; text-decoration: none;">Log In here</a>
        </footer>
    </main>

</body>
</html>
