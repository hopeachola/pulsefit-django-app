{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFit - Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">

    <main class="log-section" style="width: 100%; max-width: 400px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <header style="text-align: center; margin-bottom: 25px;">
            <h1 style="font-size: 24px; color: #0f172a; font-weight: 800;">Choose New Password</h1>
            <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Updating account security parameters for <strong>{{ user_obj.username }}</strong></p>
        </header>

        <form class="log-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" placeholder="Enter new strong password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat password entry" required>
            </div>
            <button type="submit" class="submit-btn" style="width: 100%; padding: 12px; font-size: 15px; cursor: pointer; margin-top: 10px; background-color: #10b981;">Save Changes & Login</button>
        </form>
    </main>

</body>
</html>
